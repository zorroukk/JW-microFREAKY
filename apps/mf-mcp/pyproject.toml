[project]
name = "mf-mcp"
version = "0.1.0"
description = "MCP server for Arturia MicroFreak (write-mostly MIDI, send-log state model)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.scripts]
mf-mcp = "mf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_mcp"]
